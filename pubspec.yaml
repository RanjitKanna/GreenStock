name: green_stocks
description: "Stock Investment & Carbon Footprint Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management

  # Dependency Injection
  get_it: ^8.0.2

  # Networking
  dio: ^5.4.3+1

  # Local Storage

  # Charts
  fl_chart: ^0.68.0

  # UI
  google_fonts: ^6.2.1
  skeletonizer: ^2.1.3
  percent_indicator: ^4.2.3

  # Animations
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Utilities
  intl: ^0.19.0
  dartz: ^0.10.1

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  rxdart: ^0.28.0
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
    - .env
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21

